handlers = java.util.logging.FileHandler, java.util.logging.ConsoleHandler

java.util.logging.FileHandler.pattern = config/robotsim%u.log
# No size limit, so the file is never truncated/rotated mid-run and the
# simulator's own messages are never discarded.
java.util.logging.FileHandler.limit = 0

# Default level for every logger. Kept at CONFIG so the JDK's FINE-level
# AWT/Swing GUI logging does not flood the log file.
.level = CONFIG

# Our own simulator code stays at FINE, so detailed traces (e.g. the
# path-finder graph dump) are still captured.
fr.tp.level = FINE
